name: cave.ovl
sha1: 588e8217080a2b7eaddd3bc140c87894597e1cf5
options:
  basename: cave
  target_path: orig/bin/cave.ovl
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/cave
  src_path: src/cave
  build_path: build
  asset_path: assets/cave
  ld_script_path: build/cave.ld
  ld_dependencies: True
  elf_path: build/cave.elf

  symbol_addrs_path:
    - config/symbols/cave.txt
    - config/symbols/cave.manual.txt
    - config/symbols/main.ext.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.cave.txt
  undefined_syms_auto_path: config/undefined_syms_auto.cave.txt

  gp_value: 0x8010F600
  use_legacy_include_asm: False
  migrate_rodata_to_functions: True
  asm_jtbl_label_macro: jlabel
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  create_asm_dependencies: True
  subalign: 4
  disasm_unknown: True
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: cave
    type: code
    start: 0x0
    vram: 0x80140FE0
    bss_size: 0xC4
    subsegments:
      - [0x0, rodatabin, header]
      - [0x4, .rodata, cave]
      - [0x808, c, cave]
      - [0x2C18, data, data]
      - { start: 0x2D40, type: bss, vram: 0x80143D20, name: bss }
  - [0x2D40]
